name: FinBud CI/CD — Test & Deploy to Google Cloud Run

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  SERVICE_NAME: finbud
  ARTIFACT_REPO: finbud-repo

jobs:
  test:
    name: Automated API & Balance Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest

      - name: Run Smoke & Balance Recalculation Tests
        env:
          FINBUD_DB_PATH: /tmp/test_finbud_ci.db
          FINBUD_AUTH_DB_PATH: /tmp/test_finbud_auth_ci.db
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import init_db

          init_db()
          client = TestClient(app)

          # 1. Health check
          assert client.get('/healthz').status_code == 200

          # 2. Create Cash account & verify reserves
          r = client.post('/api/accounts', json={'account_id': 101, 'account_name': 'Checking', 'type': 'Cash', 'starting_balance': 2000.0, 'is_hidden': False})
          assert r.status_code == 200

          # 3. Add pending expense transaction & verify projection
          t = client.post('/api/transactions', json={'account_id': 101, 'transaction_date': '2026-11-15', 'transaction_amount': -250.0, 'description': 'Electric Bill', 'status': 'pending'})
          assert t.status_code == 200
          tx_id = t.json()['transaction_id']

          proj = client.get('/api/cash-projection?target_date=2026-11-30').json()
          assert proj['summary']['projected_cash_on_hand'] == 1750.0

          # 4. Mark Paid -> excluded from projection
          client.put(f'/api/transactions/{tx_id}/toggle-status')
          proj2 = client.get('/api/cash-projection?target_date=2026-11-30').json()
          assert proj2['summary']['projected_cash_on_hand'] == 2000.0

          # 5. Renumber account #101 -> #102
          u = client.put('/api/accounts/101', json={'new_account_id': 102, 'account_name': 'Primary Checking'})
          assert u.status_code == 200 and u.json()['account_id'] == 102
          print('CI Smoke & Balance Engine Tests Passed!')
          "

  deploy:
    name: Build & Deploy to GCP Cloud Run
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Keyless Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-cd@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run with Persistent GCS Volume
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --service-account "github-cd@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --execution-environment gen2 \
            --add-volume=name=finbud-data,type=cloud-storage,bucket=${{ secrets.GCP_STORAGE_BUCKET }} \
            --add-volume-mount=volume=finbud-data,mount-path=/mnt/data \
            --update-env-vars="FINBUD_DB_PATH=/mnt/data/finbud.db,FINBUD_AUTH_DB_PATH=/mnt/data/finbud_auth.db,FINBUD_ACCESS_PASSWORD=${{ secrets.FINBUD_ACCESS_PASSWORD }},FINBUD_SECRET_KEY=${{ secrets.FINBUD_SECRET_KEY }}"

